  <style>
:root {
  --text: #15171A;
  --muted: #6D737C;
  --line: #DDE1E6;
  --bg: #F5F6F8;
  --accent: #5B5CE2;
  --soft: #ECEBFF;
  --ok: #1F9D68;
  --warm: #F3B83F;
  --err: #C8364B;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 Inter, "Segoe UI", system-ui, Arial, sans-serif;
}
main { flex: 1; }
.wrap {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
}
:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; }

header, footer { background: #fff; border: 0 solid var(--line); }
header { border-bottom-width: 1px; }
header .wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 60px;
}
.brand { flex: 1; font-size: 18px; font-weight: 700; }
.brand small { display: block; font-size: 12px; font-weight: 400; line-height: 1.2; color: var(--muted); }
nav { display: flex; gap: 8px; }
nav button, .chip {
  padding: 7px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  color: var(--text);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
.chip { background: var(--soft); border-color: var(--soft); color: var(--accent); }
nav button.active,
.chip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
h1 { margin: 36px 0 8px; font-size: clamp(28px, 5vw, 40px); line-height: 1.15; }
.sub { max-width: 60ch; margin: 0 0 20px; color: var(--muted); }

form {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 10px;
  padding: 12px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
}
form label { flex: 1 1 260px; font-size: 12px; color: var(--muted); }
input {
  display: block;
  width: 100%;
  margin-top: 2px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  color: var(--text);
  font: inherit;
}
#go {
  padding: 11px 28px;
  border: 0;
  border-radius: 10px;
  background: var(--accent);
  color: #fff;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
#go:disabled { background: var(--line); color: #9AA0A8; cursor: wait; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
#status { min-height: 24px; margin: 20px 0 8px; color: var(--muted); }
#status.ok { color: var(--ok); font-weight: 600; }
#status.err { color: var(--err); font-weight: 600; }
#results {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 16px;
  padding: 12px 0 40px;
}
.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 18px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
}
.card.main { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.top { display: flex; justify-content: space-between; gap: 8px; }
.card h2 { margin: 0; font-size: 18px; line-height: 1.3; }
.card p { flex: 1; margin: 0; font-size: 15px; }
.heart {
  flex: none;
  width: 40px;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: #fff;
  color: var(--muted);
  font-size: 20px;
  cursor: pointer;
}
.heart[aria-pressed="true"] { color: var(--err); border-color: var(--err); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
}
.tag.list { background: #FFF3D6; color: #8A5E00; }
.tag.mention { background: #EEF0F3; color: var(--muted); }
.tag.main { background: var(--ok); color: #fff; }
.read {
  align-self: flex-start;
  padding: 10px 16px;
  border-radius: 10px;
  background: var(--text);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
}
.read:hover { background: var(--accent); }
footer { padding: 18px 0; border-top-width: 1px; color: var(--muted); font-size: 14px; }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; }
@media (max-width: 560px) {
  .wrap { padding: 0 16px; }
  .brand small { display: none; }
  #go { flex: 1 1 100%; }
  #results { grid-template-columns: 1fr; }
}
.hero {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 32px;
  align-items: center;
}
.hero-img { width: 100%; height: auto; }
.empty {
  grid-column: 1 / -1;
  padding: 16px 0 24px;
  text-align: center;
  color: var(--muted);
}
.empty img { width: 220px; max-width: 70%; height: auto; }
.empty p { max-width: 42ch; margin: 8px auto 0; }
@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; gap: 0; }
  .hero-img { max-width: 260px; margin: 20px auto 0; }
}
</style>

<script>

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;

function setStatus(text, cls = "") {

function clean(text) {
  let t = (text || "").replace(/\[\d+\]/g, "").replace(/\s+/g, " ");
  cfg.noise.forEach(n => { t = t.replace(new RegExp(n, "gi"), ""); });
  t = t.trim();
  if (!t) return "Описание недоступно.";
  if (t.length <= 220) return t;
  const cut = t.slice(0, 220);
  const dot = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("? "), cut.lastIndexOf("! "));
  return dot > 90 ? cut.slice(0, dot + 1) : cut.slice(0, cut.lastIndexOf(" ")).replace(/[,;:(—-]+$/, "") + "…";
}

function classify(title, q) {
  const t = title.toLowerCase(), qn = q.toLowerCase().trim();
  if (/^(список|перечень|категория)\b|\(значения\)/.test(t)) return "list";
  if (t.includes(qn)) return "article";
  const words = qn.split(/\s+/).filter(w => w.length > 2);
  return words.length && words.every(w => t.includes(w.slice(0, Math.max(3, w.length - 2)))) ? "article" : "mention";
}
async function search(q) {
  q = q.trim();
  if (!q) return;
  query = q; searched = true; view = "search"; filter = "all";
  $("#go").disabled = true;
  setStatus("Ищем статьи по запросу «" + q + "»…");
  const url = "https://ru.wikipedia.org/w/api.php?action=query&format=json&origin=*" +
    "&generator=search&gsrsearch=" + encodeURIComponent(q) + "&gsrlimit=" + cfg.limit +
    "&prop=extracts|info&exintro=1&explaintext=1&exlimit=max&exchars=600&inprop=url";
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const pages = Object.values((data.query && data.query.pages) || {}).sort((a, b) => a.index - b.index);
    items = pages.map(p => ({
      id: String(p.pageid), title: p.title, snippet: clean(p.extract),
      type: classify(p.title, q), url: p.fullurl, main: false
    }));
    const main = items.filter(i => i.type === "article").sort((a, b) => a.title.length - b.title.length)[0];
    if (main) { main.main = true; items = [main, ...items.filter(i => i !== main)]; }
  } catch (e) {
    items = [];
    setStatus("Не удалось загрузить данные. Проверьте интернет и нажмите «Найти» ещё раз.", "err");
    $("#go").disabled = false;
    return;
  }
  $("#go").disabled = false;
  render();
}
function card(it) {

  heart.type = "button";
  heart.setAttribute("aria-pressed", !!favs[it.id]);
  heart.setAttribute("aria-label", "В избранное: " + it.title);
  heart.onclick = () => { favs[it.id] ? delete favs[it.id] : (favs[it.id] = it); saveFavs(); render(); };
  top.append(el("h2", null, it.title), heart);
  const tags = el("div", "tags");
  if (it.main) tags.append(el("span", "tag main", "Основная статья"));
  tags.append(el("span", "tag " + it.type, TYPES[it.type]));
  const link = el("a", "read", "Читать статью в Википедии");
  link.href = it.url; link.target = "_blank"; link.rel = "noopener noreferrer";
  c.append(top, tags, el("p", null, it.snippet), link);
  return c;
}

function render() {
